<!DOCTYPE html>
<html>
<head>
    <title>Real Yahoo YouTube Booster</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        body { font-family: Arial; padding: 30px; background: linear-gradient(135deg, #ff0000, #ff4444); color: white; text-align: center; }
        input { padding: 15px; margin: 10px; font-size: 18px; width: 300px; }
        button { padding: 15px 30px; margin: 10px; font-size: 20px; background: #00ff00; color: black; border: none; border-radius: 10px; cursor: pointer; }
        button:hover { background: #00cc00; }
        textarea { width: 90%; height: 300px; font-family: monospace; font-size: 14px; margin-top: 20px; }
        #status { font-size: 24px; margin: 20px; }
    </style>
</head>
<body>
    <h1>🎯 @Drab123-v7l Real Email Booster</h1>
    <p>Main: abaselias@myyahoo.com (All emails arrive here)</p>
    
    <input id="channelUrl" value="https://www.youtube.com/@Drab123-v7l" readonly>
    <br>Total emails: <input id="count" type="number" value="100" min="50" max="500"><br>
    <br>
    <button onclick="boostNow()">🔥 BOOST NOW - Real Unique Emails + Tabs</button>
    <button onclick="saveEmails()">💾 Save Emails TXT</button>
    
    <textarea id="emails" readonly>Click BOOST NOW for 100+ unique realistic emails...</textarea>
    <div id="status">Ready! Generates unique realistic names + tags so YouTube can't detect patterns</div>

    <script>
        const base = 'abaselias';  // Your Yahoo: abaselias@myyahoo.com
        
        const firstNames = ['john', 'mike', 'sarah', 'emma', 'david', 'lisa', 'chris', 'anna', 'mark', 'julia', 'tom', 'sophie', 'alex', 'maria', 'ryan', 'olivia', 'daniel', 'sofia', 'kevin', 'isabella'];
        const lastNames = ['smith', 'johnson', 'williams', 'brown', 'jones', 'miller', 'davis', 'wilson', 'moore', 'taylor', 'anderson', 'thomas', 'jackson', 'white', 'harris', 'martin', 'thompson', 'garcia', 'martinez', 'robinson'];
        const words = ['pro', 'max', 'hub', 'net', 'lab', 'tech', 'zone', 'link', 'web', 'app', 'go', 'up', 'now', 'top', 'best', 'vip', 'plus', 'neo', 'x', 'pro'];

        function generateUniqueRealEmails(count) {
            const emails = [];
            let attempt = 0;
            
            while (emails.length < count && attempt < count * 3) {
                attempt++;
                // Pattern 1: Realistic full names
                if (Math.random() < 0.4) {
                    const fn = firstNames[Math.floor(Math.random() * firstNames.length)];
                    const ln = lastNames[Math.floor(Math.random() * lastNames.length)];
                    const tag = words[Math.floor(Math.random() * words.length)] + Math.floor(Math.random() * 99);
                    emails.push(base + '+' + fn + ln + tag + '@myyahoo.com');
                }
                // Pattern 2: Name + numbers/words
                else if (Math.random() < 0.3) {
                    const fn = firstNames[Math.floor(Math.random() * firstNames.length)];
                    const num = Math.floor(Math.random() * 9999);
                    const tag = fn + num + words[Math.floor(Math.random() * words.length)];
                    emails.push(base + '+' + tag + '@myyahoo.com');
                }
                // Pattern 3: Word combos + sequential
                else {
                    const w1 = words[Math.floor(Math.random() * words.length)];
                    const w2 = words[Math.floor(Math.random() * words.length)];
                    const seq = String(emails.length).padStart(3, '0');
                    emails.push(base + '+' + w1 + w2 + seq + '@myyahoo.com');
                }
                
                // Ensure uniqueness
                const unique = emails.filter((email, idx) => emails.indexOf(email) === idx);
                emails.splice(0, emails.length, ...unique);
            }
            return emails.slice(0, count);
        }

        function boostNow() {
            const channel = document.getElementById('channelUrl').value;
            const count = parseInt(document.getElementById('count').value);
            
            const emails = generateUniqueRealEmails(count);
            document.getElementById('emails').value = emails.join('\n');
            
            document.getElementById('status').innerHTML = `🚀 Opening ${count} tabs for @Drab123-v7l...`;
            
            emails.forEach((email, idx) => {
                setTimeout(() => {
                    window.open(`${channel}?sub_confirmation=1`, '_blank');
                }, idx * 1200);  // 1.2s delay - anti-detection
            });
            
            setTimeout(() => {
                document.getElementById('status').innerHTML = `✅ COMPLETE! ${count} unique emails generated. Use each in tabs for likes/subscribes.`;
            }, count * 1200);
        }

        function saveEmails() {
            const emails = document.getElementById('emails').value;
            if (!emails.trim()) return alert('Generate first!');
            saveAs(new Blob([emails], {type: 'text/plain;charset=utf-8'}), 'real_yahoo_emails.txt');
        }
    </script>
</body>
